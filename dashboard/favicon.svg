<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Moffitt Money">
  <!-- An Art Deco monogram with the classic inline: a channel of the ground
       cut down the centre of every stroke. Splayed stems, pointed apexes,
       and the centre V driven to the baseline.

       The stems are deliberately fat. The inline is the whole point of the
       mark, and at 16 pixels — where a tab actually renders it — one unit of
       this 32-unit grid is half a pixel, so a hairline inline greys out into
       mush. At two units it is a full pixel and the channel still reads at
       tab size; the stems had to widen to carry it. That is the entire
       reason this letter is heavier than a poster M would be.

       The mark carries its own deep ground because a tab icon sits on
       browser chrome and cannot inherit the site's light or dark theme, and
       the letter is a path rather than text because a favicon must not
       depend on a font. -->
  <rect width="32" height="32" rx="2" fill="#0b0b0a"/>
  <path d="M2.8 26.5 L8.2 5.5 h5.6 L16 15.2 L18.2 5.5 h5.6 L29.2 26.5 h-6.0
           L20.9 15.6 L18.4 26.5 h-4.8 L11.1 15.6 L8.8 26.5 Z" fill="#c9a227"/>
  <path d="M6.6 24.2 L10.4 9.6 M25.4 24.2 L21.6 9.6 M16 21.4 L13.9 12.6 M16 21.4 L18.1 12.6"
        stroke="#0b0b0a" stroke-width="2.0"/>
</svg>
