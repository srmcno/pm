name: Backtest the spot scanner
on:
  workflow_dispatch: {}
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['scripts/backtest-opportunities.mjs', 'dashboard/market-core.mjs', '.github/workflows/scanner-backtest.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: scanner-backtest
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/market-core.test.mjs tests/scanner-backtest.test.mjs
      - name: Collect and replay 90 days of actual candle history
        run: node scripts/backtest-opportunities.mjs --collect
      - name: Commit reproducible inputs and all scenario results
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/opportunities/backtest-inputs.json.gz dashboard/data/scanner-backtest.json reports/scanner-backtest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: 90-day scanner replay with preserved inputs'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then
              gh workflow run jekyll-gh-pages.yml --ref '${{ github.event.repository.default_branch }}'
              exit 0
            fi
          done
          exit 1
