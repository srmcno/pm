name: Desk system shift

# Runs the multi-desk system in back-to-back shifts. Paper-only until
# broker credentials exist as repository secrets; adding them is the single
# switch that turns on order mirroring, and even then the venue's PAPER
# endpoint is the default — real money needs DESK_REAL_MONEY=1 as well.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 */2 * * *"   # best-effort backup; the chain below is primary

concurrency:
  group: desk-shift
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      DESK_REAL_MONEY: ${{ secrets.DESK_REAL_MONEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Shifts perpetuate themselves; the concurrency group holds the
      # successor pending until this one ends. Disabling the workflow in the
      # Actions UI is the off switch.
      - name: Queue the next shift
        run: gh workflow run desk-shift.yml --ref "${GITHUB_REF_NAME}" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.31,<3"

      - name: Run one shift
        working-directory: scripts
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          # A STOP file in the repository halts every shift without needing
          # a workflow edit — the same switch the CLI writes.
          if [ -f ../data/desk/STOP ]; then
            echo "::warning::data/desk/STOP present — not trading this shift"
            python3 -m desk.cli publish
            exit 0
          fi
          if [ -n "$APCA_API_KEY_ID" ] && [ -n "$APCA_API_SECRET_KEY" ]; then
            if [ "$DESK_REAL_MONEY" = "1" ]; then
              echo "Mirroring to the REAL MONEY endpoint."
              python3 -m desk.cli watch --minutes 110 --seconds 300 \
                --live --i-accept-total-loss --real-money
            else
              echo "Mirroring to the broker's PAPER endpoint."
              python3 -m desk.cli watch --minutes 110 --seconds 300 \
                --live --i-accept-total-loss
            fi
          else
            echo "No broker credentials — simulated fills only."
            python3 -m desk.cli watch --minutes 110 --seconds 300
          fi

      - name: Commit state
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in data/desk dashboard/data reports; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -m "auto: desk shift $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" \
            || { git rebase --abort || true; echo "::error::rebase failed"; exit 1; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # GITHUB_TOKEN pushes never trigger on-push workflows — deploy explicitly.
          gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}" \
            || echo "::warning::pages dispatch failed"
