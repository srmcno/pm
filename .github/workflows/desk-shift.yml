name: U.S. desk paper cycle

# Short paper cycles load the current code and save the book after each scan.
# Broker keys, when configured, supply quotes only. This workflow never arms orders.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '4-59/5 * * * *'
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['scripts/desk/**', '.github/workflows/desk-shift.yml']

concurrency:
  group: desk-shift
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'requests>=2.31,<3'
      - name: Run one paper decision cycle
        id: cycle
        continue-on-error: true
        working-directory: scripts
        run: python3 -m desk.cli run
      - name: Save this cycle without overwriting another writer
        if: always() && (steps.cycle.outcome == 'success' || steps.cycle.outcome == 'failure')
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          for file in data/desk/state.json data/desk/risk-state.json data/desk/journal.jsonl dashboard/data/desk.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: U.S. desk paper cycle'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then exit 0; fi
          done
          exit 1
      - name: Surface a failed paper cycle
        if: steps.cycle.outcome == 'failure'
        run: exit 1
