name: Archived copy settlement
on:
  workflow_dispatch: {}
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: write
concurrency:
  group: archived-copy-settlement
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve existing simulated positions only
        id: settle
        continue-on-error: true
        run: node scripts/collect-copy-study.mjs --settlement-only
      - name: Preserve official settlement receipts
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/copy-forward dashboard/data/copy-study.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: archived copy settlement receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then exit 0; fi
          done
          exit 1
      - name: Report settlement source failure
        if: steps.settle.outcome == 'failure'
        run: exit 1
