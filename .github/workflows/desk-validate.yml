name: Desk walk-forward validation

# Re-runs walk-forward validation on every desk and commits the evidence.
# This is what decides whether a desk is allowed to trade at all, so it runs
# on a schedule rather than only when someone remembers: a strategy whose
# edge has decayed should lose its `validated` verdict on its own, without
# anyone having to notice first.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 6 * * 1"     # Mondays, before the US session

concurrency:
  group: desk-validate
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "requests>=2.31,<3"

      - name: Unit tests
        working-directory: scripts
        run: |
          for t in tests/test_desk_core.py tests/test_runner.py tests/test_kalshi_desk.py \
                   tests/test_venue_alpaca.py tests/test_venue_kalshi.py; do
            python3 "$t"
          done

      - name: Walk-forward every desk
        working-directory: scripts
        run: python3 -m desk.cli validate --folds 5

      - name: Commit evidence
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/desk/evidence.json reports/desk-evidence.md dashboard/data || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: desk validation $(date -u +'%Y-%m-%d')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}" || true
