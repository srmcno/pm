name: Verify strategies and execution
on:
  pull_request: {}
  push:
    paths: ['scripts/**', 'engine/**', 'tests/**', 'dashboard/*.mjs', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'requests>=2.31,<3'
      - run: python -m unittest discover -s scripts/tests
      - run: python -m unittest discover -s tests
      - run: node --test tests/market-core.test.mjs tests/scanner-backtest.test.mjs
      - run: python scripts/check_site.py
