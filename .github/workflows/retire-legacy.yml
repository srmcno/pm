name: Stop retired legacy shifts
on:
  workflow_dispatch: {}
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['.github/workflows/retire-legacy.yml']
permissions:
  actions: write
  contents: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete running and queued research shifts
        run: |
          python3 - <<'PY'
          import json, subprocess
          repo='${{ github.repository }}'
          names=['arb-watch','watch-shift','engine-shift','autotrade','stocks-shift','kraken-watch','refresh-dashboard']
          active={'in_progress','queued','pending','waiting','requested'}
          runs={}
          for name in names:
            for status in sorted(active):
              page=1
              while True:
                endpoint=f'repos/{repo}/actions/workflows/{name}.yml/runs?status={status}&per_page=100&page={page}'
                raw=subprocess.check_output(['gh','api',endpoint],text=True)
                batch=json.loads(raw).get('workflow_runs',[])
                runs.update({run['id']:run for run in batch})
                if len(batch)<100: break
                page+=1
          for run_id in runs:
            endpoint=f'repos/{repo}/actions/runs/{run_id}'
            result=subprocess.run(['gh','api','-X','POST',endpoint+'/cancel'],capture_output=True,text=True)
            if result.returncode:
              current=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
              if current.get('status') in active:
                raise RuntimeError(f'Could not cancel retired run {run_id}: {result.stderr}')
            print(f'Cancelled or already completed retired run: {run_id}')
          PY
      - name: Remove only merged branches preserved in the default branch
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          repo='${{ github.repository }}'
          default='${{ github.event.repository.default_branch }}'
          candidates=['claude/app-profitability-live-n0eas7','claude/crypto-arbitrage-low-latency-btfyvw','claude/polymarket-consensus-optimization-urfhfe','copilot/fix-bot-stale-message','copilot/fix-github-actions-job','codex/us-opportunity-terminal-20260908']
          branches=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/branches?per_page=100'],text=True))
          for branch in branches:
            name=branch['name']
            if name==default or name not in candidates or branch.get('protected'): continue
            ref=urllib.parse.quote(name,safe='')
            base=urllib.parse.quote(default,safe='')
            compare=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/compare/{base}...{ref}'],text=True))
            if compare.get('status') in ('behind','identical'):
              subprocess.run(['gh','api','-X','DELETE',f'repos/{repo}/git/refs/heads/{ref}'],check=True)
              print(f'Removed merged branch: {name}')
            else: print(f'Preserved unmerged work: {name}')
          PY
