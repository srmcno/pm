name: Monthly ETF paper cycle
on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 22 * * 1-5'
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['scripts/etf_lab.py', '.github/workflows/etf-paper.yml']
permissions:
  contents: write
concurrency:
  group: etf-paper
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ETF accounting and timing
        run: python3 -m unittest discover -s tests -p test_etf_lab.py
      - name: Advance simulated account (no broker credentials or order path)
        id: cycle
        continue-on-error: true
        run: python3 scripts/etf_lab.py paper
      - name: Save account and source receipt without overwriting another writer
        if: always() && (steps.cycle.outcome == 'success' || steps.cycle.outcome == 'failure')
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          for file in data/etf/paper.json dashboard/data/etf-paper.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: monthly ETF forward paper receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then exit 0; fi
          done
          exit 1
      - name: Surface failed cycle
        if: steps.cycle.outcome == 'failure'
        run: exit 1
