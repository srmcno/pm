name: Opportunity and copy study scan
on:
  workflow_dispatch: {}
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['scripts/collect-opportunities.mjs', 'scripts/collect-crypto-strategies.mjs', 'scripts/crypto-feed.mjs', 'scripts/crypto-cycle.mjs', 'scripts/rotation-study.mjs', 'scripts/legacy-spot-exit-only.mjs', 'dashboard/crypto-strategies-core.mjs', 'tests/app-schema.test.mjs', 'tests/crypto-strategies.test.mjs', 'scripts/collect-crypto-arbitrage.mjs', 'scripts/collect-copy-study.mjs', 'scripts/copy-study-core.mjs', 'scripts/copy-study-lock.py', 'dashboard/crypto-arbitrage-core.mjs', 'dashboard/market-core.mjs', 'dashboard/outcomes.mjs', 'dashboard/data/scanner-backtest.json', '.github/workflows/opportunities.yml']
permissions:
  contents: write
concurrency:
  group: opportunity-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strategy accounting and retirement before advancing any ledger
        run: npm test
      - name: Advance independent multi-coin paper strategies
        id: strategies
        continue-on-error: true
        run: node scripts/collect-crypto-strategies.mjs
      - name: Compare public crypto order books
        run: node scripts/collect-crypto-arbitrage.mjs
        id: crypto
        continue-on-error: true
      - name: Publish research snapshots without overwriting another writer
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dashboard/data/crypto-arbitrage.json
          for file in dashboard/data/crypto-strategies.json data/crypto-strategies/state.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: opportunity and copy study snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then exit 0; fi
          done
          exit 1
      - name: Surface an upstream failure
        if: steps.strategies.outcome == 'failure' || steps.crypto.outcome == 'failure'
        run: exit 1
