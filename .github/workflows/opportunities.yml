name: U.S. opportunity scan
on:
  workflow_dispatch: {}
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['scripts/collect-opportunities.mjs', 'dashboard/market-core.mjs', 'dashboard/outcomes.mjs', 'dashboard/data/scanner-backtest.json', '.github/workflows/opportunities.yml']
permissions:
  contents: write
concurrency:
  group: opportunity-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect quotes and advance the isolated paper ledger
        id: scan
        continue-on-error: true
        run: node scripts/collect-opportunities.mjs
      - name: Publish snapshot without overwriting another writer
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dashboard/data/opportunities.json data/opportunities/paper.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: U.S. opportunity snapshot'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then exit 0; fi
          done
          exit 1
      - name: Surface a complete upstream outage
        if: steps.scan.outcome == 'failure'
        run: exit 1
