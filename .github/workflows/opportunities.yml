name: Opportunity and copy study scan
on:
  workflow_dispatch: {}
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [claude/polymarket-wallets-analysis-m81p4j]
    paths: ['scripts/collect-opportunities.mjs', 'scripts/collect-crypto-arbitrage.mjs', 'scripts/collect-copy-study.mjs', 'scripts/copy-study-core.mjs', 'scripts/copy-study-lock.py', 'dashboard/crypto-arbitrage-core.mjs', 'dashboard/market-core.mjs', 'dashboard/outcomes.mjs', 'dashboard/data/scanner-backtest.json', '.github/workflows/opportunities.yml']
permissions:
  contents: write
concurrency:
  group: opportunity-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect quotes and advance the isolated paper ledger
        id: scan
        continue-on-error: true
        run: node scripts/collect-opportunities.mjs
      - name: Compare public crypto order books
        # Public crypto comparisons share the existing schedule; they never
        # advance a ledger or invoke the retired international collectors.
        run: node scripts/collect-crypto-arbitrage.mjs
        id: crypto
        continue-on-error: true
      - name: Advance the isolated forward copy study
        run: node scripts/collect-copy-study.mjs
        id: copy
        continue-on-error: true
      - name: Publish research snapshots without overwriting another writer
        run: |
          git config user.name 'moffitt-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dashboard/data/opportunities.json dashboard/data/crypto-arbitrage.json data/opportunities/paper.json dashboard/data/copy-study.json data/copy-forward
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: opportunity and copy study snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.event.repository.default_branch }}' || { git rebase --abort; exit 1; }
            if git push origin 'HEAD:${{ github.event.repository.default_branch }}'; then exit 0; fi
          done
          exit 1
      - name: Surface a complete upstream outage
        if: steps.scan.outcome == 'failure' || steps.crypto.outcome == 'failure' || steps.copy.outcome == 'failure'
        run: exit 1
