# Publishes dashboard/ as the GitHub Pages site root (no Jekyll build —
# the dashboard is a single self-contained HTML file).
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["claude/polymarket-wallets-analysis-m81p4j"]
    paths: ["dashboard/**", ".github/workflows/jekyll-gh-pages.yml"]
  # The desks commit fresh dashboard data every minute or two. Deploying on
  # each of those commits does not publish the site FASTER — it publishes it
  # never: only one run may be queued in the "pages" concurrency group, so
  # every queued deploy was cancelled by the next one before a runner picked
  # it up, and the site served three-day-old data while the bots ran fine.
  # Five minutes is the shortest interval GitHub schedules, and a deploy
  # takes about one, so these never overlap. The interval is also a floor on
  # how stale the published data can look: a desk that writes a fresh scan
  # the second after a deploy is not visible until the next one, so every
  # freshness budget on the dashboard has to cover this on top of the desk's
  # own heartbeat.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
