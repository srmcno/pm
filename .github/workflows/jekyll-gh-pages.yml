# Publishes the fresh static build with the checked-out commit recorded.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["claude/polymarket-wallets-analysis-m81p4j"]
    paths: ["dashboard/**", "scripts/build-site.mjs", "package.json", ".github/workflows/jekyll-gh-pages.yml"]
  # Data commits from workflow tokens do not trigger push workflows.
  # Scheduled publishing is best effort; source timestamps remain visible.
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["U.S. opportunity scan", "U.S. desk paper cycle", "Prediction market paper cycle", "Monthly ETF paper cycle"]
    types: [completed]
    branches: ["claude/polymarket-wallets-analysis-m81p4j"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the site before publishing
        run: |
          npm test
          python3 scripts/check_site.py
          npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
