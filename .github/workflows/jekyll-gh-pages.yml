# Publishes the verified dashboard directory with the checked-out commit recorded.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["claude/polymarket-wallets-analysis-m81p4j"]
    paths: ["dashboard/**", ".github/workflows/jekyll-gh-pages.yml"]
  # Data commits from workflow tokens do not trigger push workflows.
  # Scheduled publishing is best effort; source timestamps remain visible.
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["U.S. opportunity scan", "U.S. desk paper cycle"]
    types: [completed]
    branches: ["claude/polymarket-wallets-analysis-m81p4j"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the site before publishing
        run: |
          node --test tests/market-core.test.mjs tests/scanner-backtest.test.mjs tests/data-client.test.mjs tests/outcomes.test.mjs
          python3 scripts/check_site.py
          python3 - <<'PY'
          import json, subprocess, datetime
          with open('dashboard/build-info.json','w') as f:
            json.dump({'version':'4.1.0','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat()},f)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
