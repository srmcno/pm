# Publishes dashboard/ as the GitHub Pages site root (no Jekyll build —
# the dashboard is a single self-contained HTML file).
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["claude/polymarket-wallets-analysis-m81p4j"]
    paths: ["dashboard/**", ".github/workflows/jekyll-gh-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
