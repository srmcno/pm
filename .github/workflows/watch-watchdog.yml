name: Dashboard watchdog
on:
  workflow_dispatch: {}
  schedule:
    - cron: '20,50 * * * *'
permissions:
  actions: write
jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recover a missing opportunity scan
        run: |
          gh api 'repos/${{ github.repository }}/actions/workflows/opportunities.yml/runs?per_page=1' > /tmp/runs.json
          python3 - <<'PYCODE'
          import json, datetime, subprocess
          with open('/tmp/runs.json') as f: runs=json.load(f).get('workflow_runs', [])
          run=runs[0] if runs else {}
          active=run.get('status') in ('in_progress','queued','pending','waiting')
          age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(run.get('created_at','1970-01-01T00:00:00Z').replace('Z','+00:00'))).total_seconds()
          if not active and age>900:
            subprocess.run(['gh','workflow','run','opportunities.yml','--repo','${{ github.repository }}','--ref','${{ github.event.repository.default_branch }}'],check=True)
          PYCODE
