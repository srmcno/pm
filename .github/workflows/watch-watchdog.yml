name: Dashboard watchdog
on:
  workflow_dispatch: {}
  schedule:
    - cron: '20,50 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: dashboard-watchdog
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The local build supplies HEAD's interface revision; a failed build only skips that comparison.
      - name: Build default-branch interface identity
        continue-on-error: true
        run: npm run build
      - name: Check Pages and recover missed or failed active collectors
        run: python3 scripts/watchdog.py
