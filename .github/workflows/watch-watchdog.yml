name: Dashboard watchdog
on:
  workflow_dispatch: {}
  schedule:
    - cron: '20,50 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: dashboard-watchdog
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check Pages and recover missed or failed active collectors
        run: python3 scripts/watchdog.py
