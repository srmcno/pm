name: Tournament verification workspace
on:
  push:
    paths: ['.github/workflows/tournament-workspace.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle source and original test data without git credentials
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/workspace-revision.txt"
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf "$RUNNER_TEMP/tournament-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-source
          path: |
            ${{ runner.temp }}/tournament-source.tar.gz
            ${{ runner.temp }}/workspace-revision.txt
          retention-days: 1
