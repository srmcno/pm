name: Apply crypto tournament v6
on:
  push:
    paths: ['.github/workflows/apply-crypto-v6.yml']
permissions:
  contents: write
concurrency:
  group: crypto-v6-source-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and apply reviewed patch
        run: |
          cat .github/crypto-v6/chunk-*.txt | base64 -d > "$RUNNER_TEMP/crypto-v6.patch.gz"
          gzip -dc "$RUNNER_TEMP/crypto-v6.patch.gz" > "$RUNNER_TEMP/crypto-v6.patch"
          git apply --check "$RUNNER_TEMP/crypto-v6.patch"
          git apply "$RUNNER_TEMP/crypto-v6.patch"
          # These temporary workflow files are removed after source publication
          # through the authenticated connector, not by GITHUB_TOKEN.
          git checkout HEAD -- .github/workflows/crypto-source-bundle.yml .github/workflows/tournament-workspace.yml
          rm -rf .github/crypto-v6
          git diff --exit-code -- .github/workflows/crypto-source-bundle.yml .github/workflows/tournament-workspace.yml .github/workflows/apply-crypto-v6.yml
      - name: Verify full project
        run: |
          pip install 'requests>=2.31,<3'
          npm test
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s tests
          python3 scripts/check_site.py
          npm run build
      - name: Commit verified source without replacing collector data
        run: |
          git config user.name 'moffitt-money-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 1
          fi
          git commit -m 'feat: expand crypto tournament to dynamic v6'
          for attempt in 1 2 3; do
            if git pull --rebase origin '${{ github.event.repository.default_branch }}' && git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
