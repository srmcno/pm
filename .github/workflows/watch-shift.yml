name: Sharp Money real-time watcher (opt-in)

# Continuous watching in back-to-back 2-hour shifts. Free on public repos.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 */2 * * *"

concurrency:
  group: watch-shift
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 118
    env:
      PM_PRIVATE_KEY: ${{ secrets.PM_PRIVATE_KEY }}
      PM_PROXY_ADDRESS: ${{ secrets.PM_PROXY_ADDRESS }}
      PM_SIGNATURE_TYPE: ${{ secrets.PM_SIGNATURE_TYPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-wallets-analysis-m81p4j

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests py-clob-client

      - name: Watch for one shift
        working-directory: scripts
        run: |
          if [ -n "$PM_PRIVATE_KEY" ]; then
            python3 watch.py --duration-minutes 110 --execute
          else
            echo "No keys configured — watching in plan-only mode."
            python3 watch.py --duration-minutes 110
          fi

      - name: Commit journal and reports back
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live data/signals reports dashboard/data || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: watcher shift $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin claude/polymarket-wallets-analysis-m81p4j || true
          git push origin HEAD:claude/polymarket-wallets-analysis-m81p4j
