name: Sharp Money real-time watcher (opt-in)

# Continuous watching in back-to-back 2-hour shifts. Free on public repos.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 */2 * * *"

concurrency:
  group: watch-shift
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # the watcher dispatches the Pages deploy after data pushes

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 118
    env:
      PM_PRIVATE_KEY: ${{ secrets.PM_PRIVATE_KEY }}
      PM_PROXY_ADDRESS: ${{ secrets.PM_PROXY_ADDRESS }}
      PM_SIGNATURE_TYPE: ${{ secrets.PM_SIGNATURE_TYPE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Run on whichever branch the schedule or dispatch targeted, so a
      # dispatch for another branch can never publish data to this one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # GitHub's cron scheduler is best-effort (it has gone hours here
      # without firing once), so shifts perpetuate themselves: queue the
      # successor immediately. The concurrency group holds it pending until
      # this shift ends, giving gapless coverage even if this run crashes
      # later. Disabling the workflow in the Actions UI breaks the chain —
      # that is the off switch.
      - name: Queue the next shift
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch-shift.yml --ref "${GITHUB_REF_NAME}" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests py-clob-client

      - name: Watch for one shift
        working-directory: scripts
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$PM_PRIVATE_KEY" ]; then
            python3 watch.py --duration-minutes 115 --paper --execute --git-push
          else
            echo "No keys configured — paper trading only."
            python3 watch.py --duration-minutes 115 --paper --git-push
          fi

      - name: Commit journal and reports back
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live data/signals data/paper reports dashboard/data || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: watcher shift $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # GITHUB_TOKEN pushes never trigger on-push workflows — deploy explicitly.
          gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}" || true
