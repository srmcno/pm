name: Arb desk watcher

# Scans MEXC spot for triangular edges every ~25s in back-to-back ~2-hour
# shifts, paper-trades the verified ones, and publishes to the site.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 */2 * * *"   # best-effort backup; the chain below is primary

concurrency:
  group: arb-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # queues the next shift and dispatches the Pages deploy

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 118
    env:
      GH_TOKEN: ${{ github.token }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # GitHub's cron scheduler is best-effort, so shifts perpetuate
      # themselves; the concurrency group holds the successor pending until
      # this shift ends. Disabling the workflow in the Actions UI is the
      # off switch.
      - name: Queue the next shift
        run: gh workflow run arb-watch.yml --ref "${GITHUB_REF_NAME}" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scan for one shift
        working-directory: scripts
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$MEXC_API_KEY" ]; then
            python3 arb.py watch --duration-minutes 113 --execute
          else
            echo "No MEXC keys — paper only."
            python3 arb.py watch --duration-minutes 113
          fi

      - name: Commit results
        run: |
          git config user.name "sharp-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/arb dashboard/data reports || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: arb shift $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # GITHUB_TOKEN pushes never trigger on-push workflows — deploy explicitly.
          gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}" || true
