# This is the real-capable worker in its initial, disarmed commissioning mode.
# The account owner performs live activation after private preflight checks.
services:
  - type: worker
    name: moffitt-rotation
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: claude/polymarket-wallets-analysis-m81p4j
    buildCommand: node --test tests/live-*.test.mjs
    startCommand: node scripts/live/runner.mjs
    autoDeployTrigger: off
    numInstances: 1
    disk:
      name: rotation-journal
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: MM_MODE
        value: preview
      - key: MM_DATA_DIR
        value: /var/data/rotation
      - key: MM_SCAN_SECONDS
        value: '300'
      - key: MM_MONTHLY_HOSTING_USD
        value: '7.25'
      - key: MM_ALLOCATION_USD
        value: '18.85'
      - key: MM_STRATEGY
        value: hybrid
      - key: MM_CAPACITY_PROFILE
        value: trend
      - key: MM_MAX_ORDER_USD
        value: '9.4'
      - key: MM_LOSS_LIMIT_USD
        value: '4'
      # Separate prediction-arbitrage engine (docs/PREDICTION-ARB-WORKER.md).
      # preview never submits. Secrets and owner choices use sync:false, so
      # no value is stored here; enter them in Render's private Environment.
      - key: PM_MODE
        value: preview
      - key: PM_SCAN_SECONDS
        value: '300'
      - key: PM_ALLOW_SPORTS
        value: 'false'
      - key: PM_MAX_TRADE_USD
        value: '5'
      - key: PM_LOSS_LIMIT_USD
        value: '5'
      - key: PM_KALSHI_ALLOCATION_USD
        sync: false
      - key: PM_LIVE_ACK
        sync: false
      - key: KALSHI_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: POLYMARKET_US_KEY_ID
        sync: false
      - key: POLYMARKET_US_SECRET_KEY
        sync: false
